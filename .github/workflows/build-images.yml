name: Build images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: openbot-server
            dockerfile: server/Dockerfile
          - image: openbot-agent-computer
            dockerfile: agent-computer/Dockerfile
          - image: openbot-supervisor
            dockerfile: supervisor/Dockerfile
          - image: openbot-agent-bot
            dockerfile: agent-bot/Dockerfile
          - image: openbot-agent-langgraph
            dockerfile: agent-langgraph/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
      - name: Compute registry owner
        id: registry
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: echo "owner=${REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Compose uses the repo root, no target override and no build args for all five.
      # This includes workspace manifests, patches, shared code and extension sources.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.registry.outputs.owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ steps.registry.outputs.owner }}/${{ matrix.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
