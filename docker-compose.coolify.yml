# Variante para Coolify v4. Véase COOLIFY.md antes del primer despliegue.
# SPIRE se omite deliberadamente. Los Bots piensan con el plan de ChatGPT de la cuenta
# conectada mediante chatgpt-login (CHATGPT_AUTH_FILE), no con OPENAI_API_KEY.
# La red default tiene nombre explícito para los contenedores creados por el supervisor.
# Sin puertos publicados: asignar el dominio a server, puerto interno 3001.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: openbot
      POSTGRES_USER: openbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U openbot -d openbot
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
    - data
  migrate:
    image: ${SERVER_IMAGE:-ghcr.io/brugiafredo/openbot-server:latest}
    pull_policy: always
    command:
    - bun
    - scripts/migrate.ts
    environment:
      DATABASE_URL: postgres://openbot:${POSTGRES_PASSWORD:-}@postgres:5432/openbot
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    networks:
    - data
  server:
    image: ${SERVER_IMAGE:-ghcr.io/brugiafredo/openbot-server:latest}
    pull_policy: always
    environment:
      PORT: '3001'
      SERVER_PORT: '3001'
      NODE_ENV: production
      DATABASE_URL: postgres://openbot:${POSTGRES_PASSWORD:-}@postgres:5432/openbot
      AGENT_COMPUTER_URL: http://agent-computer:4100
      COMPUTER_SUPERVISOR_URL: http://supervisor:4300
      MANAGED_AGENT_AG_UI_URL: ''
      PICKED_HARNESS_URL: http://agent-harness:4206
      PICKED_HARNESS_IMAGE: ${HARNESS_IMAGE:-ghcr.io/copilotkit/openbot-agent-langgraph-agui:v0.2.0}
      PICKED_HARNESS_SOURCE: installed
      PICKED_HARNESS_KIND: remote-ag-ui
      PICKED_HARNESS_NAME: ${PICKED_HARNESS_NAME:-LangGraph}
      PICKED_HARNESS_PORT: '4206'
      AGENT_ENDPOINT_ALLOWED_HOSTS: agent-harness:4206
      CHATGPT_AUTH_FILE: /root/.langchain/chatgpt-auth.json
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      INTELLIGENCE_API_URL: ${INTELLIGENCE_API_URL:-https://api.intelligence.copilotkit.ai}
      INTELLIGENCE_GATEWAY_WS_URL: ${INTELLIGENCE_GATEWAY_WS_URL:-wss://realtime.intelligence.copilotkit.ai}
      INTELLIGENCE_BROWSER_GATEWAY_WS_URL: ${INTELLIGENCE_BROWSER_GATEWAY_WS_URL:-}
      AGENT_TOOL_TOKEN: ${AGENT_TOOL_TOKEN:-}
      COMPUTER_TOKEN: ${COMPUTER_TOKEN:-}
      KEY_ENCRYPTION_KEY: ${KEY_ENCRYPTION_KEY:-}
      MANAGED_AGENT_TOKEN: ${MANAGED_AGENT_TOKEN:-}
      SUPERVISOR_TOKEN: ${SUPERVISOR_TOKEN:-}
      WORKER_SHARED_SECRET: ${WORKER_SHARED_SECRET:-}
      INTELLIGENCE_API_KEY: ${INTELLIGENCE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      CPK_INTELLIGENCE_API_KEY: ${CPK_INTELLIGENCE_API_KEY:-}
      COPILOTKIT_LICENSE_TOKEN: ${COPILOTKIT_LICENSE_TOKEN:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-}
      INITIAL_ADMIN_EMAILS: ${INITIAL_ADMIN_EMAILS:-}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      OPENBOT_PUBLIC_URL: ${OPENBOT_PUBLIC_URL:-}
      SIGNIN_ALLOWED_EMAIL_DOMAINS: ${SIGNIN_ALLOWED_EMAIL_DOMAINS:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      MICROSOFT_OAUTH_CLIENT_ID: ${MICROSOFT_OAUTH_CLIENT_ID:-}
      MICROSOFT_OAUTH_CLIENT_SECRET: ${MICROSOFT_OAUTH_CLIENT_SECRET:-}
      MICROSOFT_OAUTH_TENANT_ID: ${MICROSOFT_OAUTH_TENANT_ID:-}
      OKTA_OAUTH_CLIENT_ID: ${OKTA_OAUTH_CLIENT_ID:-}
      OKTA_OAUTH_CLIENT_SECRET: ${OKTA_OAUTH_CLIENT_SECRET:-}
      OKTA_OAUTH_ISSUER: ${OKTA_OAUTH_ISSUER:-}
      OPENBOT_ORGANIZATION_AUTH_URL: ${OPENBOT_ORGANIZATION_AUTH_URL:-}
      COMPOSIO_API_KEY: ${COMPOSIO_API_KEY:-}
      CPK_INTELLIGENCE_LEARNING_CONTAINER_ID: ${CPK_INTELLIGENCE_LEARNING_CONTAINER_ID:-}
      CPK_INTELLIGENCE_SKILLS_REVISION: ${CPK_INTELLIGENCE_SKILLS_REVISION:-}
      DEPLOYMENT_ID: ${DEPLOYMENT_ID:-}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-}
      OPENBOT_SINGLE_USER: 'false'
    user: ${OPENBOT_SERVER_USER:-1001:1001}
    depends_on:
      migrate:
        condition: service_completed_successfully
      supervisor:
        condition: service_healthy
      agent-harness:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - 'bun -e "const r = await fetch(''http://127.0.0.1:3001/health''); process.exit(r.ok
        ? 0 : 1)"'
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - data
    - default
    expose:
    - '3001'
  worker:
    image: ${SERVER_IMAGE:-ghcr.io/brugiafredo/openbot-server:latest}
    pull_policy: always
    command:
    - bun
    - ../worker/src/index.ts
    environment:
      DATABASE_URL: postgres://openbot:${POSTGRES_PASSWORD:-}@postgres:5432/openbot
      SERVER_INTERNAL_URL: http://server:3001
      WORKER_SHARED_SECRET: ${WORKER_SHARED_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      server:
        condition: service_healthy
    restart: unless-stopped
    networks:
    - data
  agent-computer:
    image: ${COMPUTER_IMAGE:-ghcr.io/brugiafredo/openbot-agent-computer:latest}
    pull_policy: always
    environment:
      COMPUTER_TOKEN: ${COMPUTER_TOKEN:-}
      COMPUTER_BROWSER_MODE: ${COMPUTER_BROWSER_MODE:-headed}
      COMPUTER_MAX_BROWSERS: ${COMPUTER_MAX_BROWSERS:-}
      COMPUTER_BROWSER_IDLE_MS: ${COMPUTER_BROWSER_IDLE_MS:-}
      COMPUTER_MEMORY_HIGH_PERCENT: ${COMPUTER_MEMORY_HIGH_PERCENT:-}
      COMPUTER_TAB_IDLE_MS: ${COMPUTER_TAB_IDLE_MS:-}
      COMPUTER_SEPARATE_WORKSPACES: 'on'
    volumes:
    - agent-workspace:/workspace
    - agent-profiles:/profiles
    stop_grace_period: 30s
    healthcheck:
      test:
      - CMD-SHELL
      - bun -e "await fetch('http://localhost:4100/health')"
      interval: 10s
      timeout: 5s
      retries: 5
  supervisor:
    image: ${SUPERVISOR_IMAGE:-ghcr.io/brugiafredo/openbot-supervisor:latest}
    pull_policy: always
    environment:
      PORT: '4300'
      SUPERVISOR_TOKEN: ${SUPERVISOR_TOKEN:-}
      COMPUTER_TOKEN: ${COMPUTER_TOKEN:-}
      COMPUTER_BROWSER_MODE: ${COMPUTER_BROWSER_MODE:-headed}
      COMPUTER_IMAGE: ${COMPUTER_IMAGE:-ghcr.io/brugiafredo/openbot-agent-computer:latest}
      COMPUTER_NAMESPACE: ${COMPUTER_NAMESPACE:-openbot-coolify}
      COMPUTER_NETWORK: ${COMPUTER_NETWORK:-openbot-coolify-computers}
      COMPUTER_RUNTIME: ${COMPUTER_RUNTIME:-}
      COMPUTER_MEMORY_BYTES: ${COMPUTER_MEMORY_BYTES:-}
    volumes:
    - type: bind
      source: /var/run/docker.sock
      target: /var/run/docker.sock
      read_only: true
      bind:
        create_host_path: false
    security_opt:
    - label=disable
    healthcheck:
      test:
      - CMD-SHELL
      - bun -e "await fetch('http://localhost:4300/health')"
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      agent-computer:
        condition: service_healthy
  agent-harness:
    image: ${HARNESS_IMAGE:-ghcr.io/copilotkit/openbot-agent-langgraph-agui:v0.2.0}
    pull_policy: always
    environment:
      PORT: '4206'
      MANAGED_AGENT_TOKEN: ${MANAGED_AGENT_TOKEN:-}
      OPENBOT_TOOL_URL: http://server:3001/api/agent-tools/call
      AGENT_TOOL_TOKEN: ${AGENT_TOOL_TOKEN:-}
      CHATGPT_AUTH_FILE: /root/.langchain/chatgpt-auth.json
      BOT_MODEL: ${BOT_MODEL:-gpt-6.1-sol}
    volumes:
    - chatgpt-auth:/root/.langchain
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:4206/health', timeout=4)
      interval: 10s
      timeout: 5s
      retries: 5
  chatgpt-login:
    image: ${HARNESS_IMAGE:-ghcr.io/copilotkit/openbot-agent-langgraph-agui:v0.2.0}
    pull_policy: always
    restart: 'no'
    volumes:
    - chatgpt-auth:/root/.langchain
    command:
    - python
    - -u
    - -c
    - |
      import json, logging, sys
      from pathlib import Path

      logging.basicConfig(level=logging.INFO, format="%(message)s", stream=sys.stdout)
      logging.getLogger("httpx").setLevel(logging.WARNING)
      logging.getLogger("httpcore").setLevel(logging.WARNING)
      STORE = Path("/root/.langchain/chatgpt-auth.json")
      IMPORT = Path("/root/.langchain/codex-auth.json")
      if STORE.exists() and STORE.stat().st_size > 0:
          print("ChatGPT ya está conectado: no hay nada que hacer.")
          sys.exit(0)
      from langchain_openai import chatgpt_oauth as oauth
      if IMPORT.exists():
          raw = json.loads(IMPORT.read_text())
          tokens = raw.get("tokens") or raw
          claims = oauth._extract_chatgpt_claims(tokens.get("id_token"))
          expiry = oauth.decode_jwt_claims(tokens["access_token"]).get("exp") or 0
          token = oauth._deserialize_token({
              "access_token": tokens["access_token"],
              "refresh_token": tokens["refresh_token"],
              "expires_at": expiry,
              "account_id": tokens.get("account_id") or claims.get("account_id"),
              "plan_type": claims.get("plan_type"),
              "user_id": claims.get("user_id"),
              "id_token": tokens.get("id_token"),
          })
          oauth._FileChatGPTOAuthTokenProvider(path=STORE).save(token)
          IMPORT.unlink()
          print("Sesión de ChatGPT importada desde codex-auth.json (archivo de origen borrado).")
          sys.exit(0)
      import time
      import httpx

      # El mismo flujo de dispositivo que "codex login --device-auth". login_chatgpt_device de
      # langchain-openai envía un formulario que auth.openai.com ya rechaza (400), por eso va aquí.
      ISSUER = "https://auth.openai.com"
      client = httpx.Client(timeout=30)
      for attempt in range(4):
          start = client.post(ISSUER + "/api/accounts/deviceauth/usercode", json={"client_id": oauth.CHATGPT_CLIENT_ID})
          start.raise_for_status()
          start = start.json()
          interval = max(int(start.get("interval") or 5), 3)
          print("")
          print("=== INICIO DE SESIÓN DE CHATGPT ===")
          print("1. Abre: " + ISSUER + "/codex/device")
          print("2. Introduce el código: " + start["user_code"])
          print("El código caduca en 15 minutos.")
          print("")
          deadline = time.monotonic() + 900
          granted = None
          while time.monotonic() < deadline:
              time.sleep(interval)
              poll = client.post(ISSUER + "/api/accounts/deviceauth/token", json={"device_auth_id": start["device_auth_id"], "user_code": start["user_code"]})
              if poll.status_code == 200:
                  granted = poll.json()
                  break
              if poll.status_code not in (403, 404, 429):
                  print("Error del servidor de OpenAI al esperar la autorización: " + str(poll.status_code))
                  sys.exit(1)
          if not granted:
              print("El código ha caducado; se genera uno nuevo.")
              continue
          response = oauth._post_form(oauth.CHATGPT_TOKEN_URL, {
              "grant_type": "authorization_code",
              "code": granted["authorization_code"],
              "redirect_uri": oauth.CHATGPT_DEVICE_REDIRECT_URI,
              "client_id": oauth.CHATGPT_CLIENT_ID,
              "code_verifier": granted["code_verifier"],
          })
          oauth._FileChatGPTOAuthTokenProvider(path=STORE).save(oauth._token_from_response(response))
          print("ChatGPT conectado. El token se guarda en el volumen chatgpt-auth.")
          sys.exit(0)
      print("No se completó el inicio de sesión. Reinicia el servicio chatgpt-login para intentarlo de nuevo.")
      sys.exit(1)
networks:
  data:
    internal: true
  default:
    name: ${COMPUTER_NETWORK:-openbot-coolify-computers}
volumes:
  postgres-data: null
  agent-workspace: null
  agent-profiles: null
  chatgpt-auth: null
